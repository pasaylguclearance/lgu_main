; App-specific PHP settings (applicant photos / fingerprint uploads can be large)
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
date.timezone = Asia/Manila

; Dev-friendly error reporting; set display_errors=Off for production
display_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
