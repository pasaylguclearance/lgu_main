services:
  app:
    build: .
    container_name: lgu_app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: "false"   # set "true" to auto-run `artisan migrate` on start
    volumes:
      # Live-edit the source: changes on Windows show up immediately in the container
      - ./:/var/www/html
      # Keep vendor/ inside a Docker volume (much faster than the Windows bind mount)
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: lgu_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: pasay_police_clearance
      MARIADB_USER: lgu
      MARIADB_PASSWORD: lgu
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=256M
      --innodb_buffer_pool_size=512M
    volumes:
      - dbdata:/var/lib/mysql
      # Any *.sql in docker/db-init runs ONCE when the data volume is first created
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s   # the 224 MB dump takes a while to import on first start

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lgu_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 512M
    depends_on:
      - db

volumes:
  dbdata:
  vendor:
